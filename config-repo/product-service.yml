server:
  port: 8082

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/shopsphere_product
    username: root
    password: root

    spring:
      jpa:
        hibernate:
          ddl-auto: update

    eureka:
      client:
        register-with-eureka: true
        fetch-registry: true
        service-url:
          defaultZone: http://localhost:8761/eureka/

      instance:
        prefer-ip-address: true