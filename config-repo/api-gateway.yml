server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:

            - id: category-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/v1/categories/**

            - id: product-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/products/**
